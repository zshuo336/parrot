name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (debug)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (debug)
        run: cargo test --workspace
      - name: Release-only threshold tests
        run: cargo test --release -p parrot --test test_thread_advantages -- --include-ignored

  macro-hygiene:
    name: Derive macro engine-neutrality lint
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-expand
        run: cargo install cargo-expand --locked || true
      - name: Expand and lint
        run: |
          if command -v cargo-expand >/dev/null 2>&1; then
            ./scripts/macro_lint.sh
          else
            echo "cargo-expand unavailable; falling back to source grep"
            ! grep -rn 'parrot::actix' parrot-api-derive/src/
          fi
