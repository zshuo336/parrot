[project]
name = "parrot-protocol-py"
version = "0.1.0"
description = "Parrot Wire 1.0 Python protocol stack + Ray adapter (DEV_03 §5 / E4)"
requires-python = ">=3.9"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
ray = ["ray>=2.9", "virtualenv!=20.21.1,>=20.0.24"]
test = ["pytest>=7", "psutil>=5.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
