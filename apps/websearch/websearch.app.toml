# websearch.app.toml —— 真实搜索引擎应用（五运行时全分工）
#
# 与 crawler-lab（合成测试）同族架构，但面向真实互联网：
#   frontier(erl)  真实 URL 去重 + BFS 调度（ETS 有序表）
#   tokenizer(ray) jieba 中文分词 + 词频（开源分词——Python 原版）
#   search(jvm)    jieba-analysis 查询切词 + BM25 + 段文件落盘
#   crawler(parrot) reqwest 真实 HTTPS 漫爬 + 编排 + 百度式 Web 页
#
# 四服务独立运行（用户裁定）：
#   清单：websearch --insecure-development --manifest websearch.app.toml <seed>
#   全链：run.sh <seed> —— 爬取→分词→索引→Web 服务
#   仅检索：websearch --serve-only —— 回放段文件独立服务（重启不丢）

name = "websearch"
version = "1.0.0"

# ── 组件（依赖序即装配序）──────────────────────────────────────────

[[components]]
name = "frontier"
engine = "erlang"
artifact = { Beam = { app = "frontier", uri = "erlang/" } }

[[components]]
name = "tokenizer"
engine = "ray"
artifact = { PyModule = { module = "tokenizer", uri = "python/" } }
deps = ["frontier"]

[[components]]
name = "search"
engine = "akka"
artifact = { Jvm = { main_class = "websearch.search.SearchComponent", uri = "jvm/target/websearch-jvm-1.0.0.jar" } }
deps = ["tokenizer"]

[[components]]
name = "crawler"
engine = "parrot"
# websearch --manifest embeds this real workflow actor; paths resolve relative to this file.
artifact = { Props = { factory = "websearch.crawler" } }
deps = ["frontier", "tokenizer", "search"]
hooks = { on_start = ".", on_drain = ".", on_stop = "." }

# 业务参数属于 crawler 组件配置，由 crawler 自己解释；config_overlay
# 只接受 parrot-config 的框架字段（例如 [config_overlay.thread]）。
[components.config]
settings = '{"sites":100,"maxdepth":10,"pages":50000,"port":8080,"data":"./data"}'

# ── 连接（WireSpec——组件间静态路由）─────────────────────────────────

[[wiring]]
from = "crawler:/user/frontier"
to = "frontier:/user/frontier"
qos = "lan"   # 本地网关之间的接线；HTTP 外网抓取由 crawler 自身处理

[[wiring]]
from = "crawler:/user/tokenizer"
to = "tokenizer:/user/tokenizer"
qos = "lan"

[[wiring]]
from = "crawler:/user/search"
to = "search:/user/search"
qos = "lan"

# ── 框架 overlay（可选）────────────────────────────────────────────
# 例如：
# [config_overlay.thread]
# shared_pool_size = 4
