# Standard local application. Paths resolve relative to this file.
# Select trusted native or sandboxed business with the explicit CLI flags.
name = "crawler-lab"
version = "2.0.0"

# ── 组件（依赖序即装配序：deps 声明 → Kahn 拓扑）──────────────────────

[[components]]
name = "frontier"
engine = "erlang"
artifact = { Beam = { app = "frontier", uri = "erlang/" } }

[[components]]
name = "index"
engine = "ray"
artifact = { PyModule = { module = "index_builder", uri = "python/" } }
deps = ["frontier"]

[[components]]
name = "search"
engine = "akka"
artifact = { Jvm = { main_class = "crawler.search.SearchComponent", uri = "jvm/target/crawler-lab-jvm-1.0.0.jar" } }
deps = ["index"]

[[components]]
name = "crawler"
engine = "parrot"
artifact = { Props = { factory = "crawler.business" } }
deps = ["frontier", "index", "search"]
hooks = { on_start = ".", on_drain = ".", on_stop = "." }

[components.config]
settings = '{"pages":60,"depth":2,"fanout":3,"batch":32}'

# ── 连接（WireSpec——组件间静态路由）─────────────────────────────────

[[wiring]]
from = "crawler:/user/frontier"
to = "frontier:/user/frontier"
qos = "lan"

[[wiring]]
from = "crawler:/user/index"
to = "index:/user/index"
qos = "lan"

[[wiring]]
from = "crawler:/user/search"
to = "search:/user/search"
qos = "lan"
