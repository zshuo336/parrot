# remote-lab POC（独立 workspace，不进根 workspace，不污染正式系统）
[workspace]

[package]
name = "remote-poc"
version = "0.1.0"
edition = "2021"

[dependencies]
parrot = { path = "../../crates/parrot" }
parrot-api = { path = "../../crates/parrot-api" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
actix = "0.13"
actix-rt = "2"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
parrot-api-derive = { path = "../../crates/parrot-api-derive" }

[profile.release]

# This independent workspace also consumes the real Parrot runtime.
[patch.crates-io]
tokio = { path = "../../vendor/tokio" }
