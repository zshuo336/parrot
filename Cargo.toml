[workspace]
resolver = "2"
members = [
    "crates/parrot",
    "crates/parrot-api",
    "crates/parrot-api-derive",
    "crates/parrot-api-derive-tests",
    "crates/parrot-config",
    "crates/parrot-remote",
    "crates/parrot-app",
    "crates/parrot-node",
    "apps/crawler-lab",
    "tools/federation-lab"
]

[workspace.dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
darling = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
thiserror = "2.0"