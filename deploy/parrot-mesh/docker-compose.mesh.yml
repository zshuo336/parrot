# 由 gen-mesh.sh 生成（N=5）——勿手改；重新生成：./gen-mesh.sh 5
# 拓扑：每节点向全部前序节点建立链路；端点使用 compose 服务 DNS
name: parrot-mesh-5

x-common: &common
  image: parrot-node:latest
  build:
    context: ../..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  networks: [mesh]

services:
  parrot-1:
    <<: *common
    container_name: mesh-parrot-1
    environment:
      PARROT_NODE_ID: parrot-1
      PARROT_BIND: 0.0.0.0:9801
      PARROT_SECURITY_MODE: insecure-development
      PARROT_SEEDS: ""
      PARROT_ACTORS: echo,counter,kv,slow
    ports:
      - "127.0.0.1:21801:9801"
  parrot-2:
    <<: *common
    container_name: mesh-parrot-2
    environment:
      PARROT_NODE_ID: parrot-2
      PARROT_BIND: 0.0.0.0:9801
      PARROT_SECURITY_MODE: insecure-development
      PARROT_SEEDS: "parrot-1=parrot-1:9801"
      PARROT_ACTORS: echo,counter,kv,slow
    ports:
      - "127.0.0.1:21802:9801"
  parrot-3:
    <<: *common
    container_name: mesh-parrot-3
    environment:
      PARROT_NODE_ID: parrot-3
      PARROT_BIND: 0.0.0.0:9801
      PARROT_SECURITY_MODE: insecure-development
      PARROT_SEEDS: "parrot-1=parrot-1:9801,parrot-2=parrot-2:9801"
      PARROT_ACTORS: echo,counter,kv,slow
    ports:
      - "127.0.0.1:21803:9801"
  parrot-4:
    <<: *common
    container_name: mesh-parrot-4
    environment:
      PARROT_NODE_ID: parrot-4
      PARROT_BIND: 0.0.0.0:9801
      PARROT_SECURITY_MODE: insecure-development
      PARROT_SEEDS: "parrot-1=parrot-1:9801,parrot-2=parrot-2:9801,parrot-3=parrot-3:9801"
      PARROT_ACTORS: echo,counter,kv,slow
    ports:
      - "127.0.0.1:21804:9801"
  parrot-5:
    <<: *common
    container_name: mesh-parrot-5
    environment:
      PARROT_NODE_ID: parrot-5
      PARROT_BIND: 0.0.0.0:9801
      PARROT_SECURITY_MODE: insecure-development
      PARROT_SEEDS: "parrot-1=parrot-1:9801,parrot-2=parrot-2:9801,parrot-3=parrot-3:9801,parrot-4=parrot-4:9801"
      PARROT_ACTORS: echo,counter,kv,slow
    ports:
      - "127.0.0.1:21805:9801"
  probe:
    <<: *common
    container_name: mesh-probe
    profiles: ["probe"]
    entrypoint: ["/usr/local/bin/parrot-probe"]
    command:
      - --insecure-development
      - parrot-1=parrot-1:9801
      - parrot-2=parrot-2:9801
      - parrot-3=parrot-3:9801
      - parrot-4=parrot-4:9801
      - parrot-5=parrot-5:9801
    depends_on:
      parrot-1:
        condition: service_healthy
      parrot-2:
        condition: service_healthy
      parrot-3:
        condition: service_healthy
      parrot-4:
        condition: service_healthy
      parrot-5:
        condition: service_healthy
    restart: "no"

networks:
  mesh:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
