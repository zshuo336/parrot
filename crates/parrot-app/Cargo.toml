[package]
name = "parrot-app"
version = "0.1.0"
edition = "2021"
description = "Parrot 应用体系：AppManifest 声明式应用模型 + Planner + AssemblingContext（DEV_09 A 阶段）"
license = "MIT"

# 分层铁律（09 §2.2）：应用定义与本地组装。不依赖 parrot 主 crate
# （引擎访问经 parrot-remote facade 协议 / PropsFactory 机制）。
[dependencies]
parrot-api = { path = "../parrot-api", features = ["remote"] }
parrot-config = { path = "../parrot-config" }
parrot-remote = { path = "../parrot-remote" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
httpdate = "1.0.3"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
futures = "0.3"
bytes = { version = "1", features = ["serde"] }

# 宿主形态（09 §2.2 分层：宿主 Runner 依赖引擎；lib 本体零引擎依赖）。
parrot = { path = "../parrot", optional = true }
parrot-wasm = { path = "../parrot-wasm", features = ["runtime"], optional = true }
parrot-abi = { path = "../parrot-abi", features = ["loader"], optional = true }
sha2 = "0.10"
url = { version = "2", optional = true }
tempfile = { version = "3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = "0.14.10"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
tempfile = "3"
libloading = "0.8.9"
parking_lot = "0.12.5"
# 场景测试需要真实 thread 引擎 + ProcessGatewayFactory（host 同集）
parrot = { path = "../parrot" }

[lib]
name = "parrot_app"
path = "src/lib.rs"

[[bin]]
name = "parrot-app"
path = "src/bin/cli.rs"
required-features = ["host"]

[features]
default = []
host = ["dep:parrot", "dep:tempfile", "dep:url"]
wasm = ["host", "dep:parrot-wasm", "dep:url"]
dylib = ["host", "dep:parrot-abi", "dep:url"]

[[example]]
name = "wasm_manifest"
required-features = ["wasm"]

[[example]]
name = "dylib_manifest"
required-features = ["dylib"]

[[example]]
name = "replay_cli"
required-features = ["host"]
