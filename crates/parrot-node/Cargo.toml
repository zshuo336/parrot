[package]
name = "parrot-node"
version = "0.1.0"
edition = "2021"
description = "Parrot standard node runtime: facade + thread engine + remote TCP (deployment unit)"
license = "MIT"

# 部署单元（应用层组装 crate）：parrot(facade) + parrot-remote(传输) 在此合流。
# 这是 E5.2 分层的预期组装点——库 crate 之间互不依赖，部署产物统一组装。

[dependencies]
parrot = { path = "../parrot" }
parrot-api = { path = "../parrot-api", features = ["remote"] }
parrot-remote = { path = "../parrot-remote" }
parrot-app = { path = "../parrot-app" }
parrot-wasm = { path = "../parrot-wasm", optional = true }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
futures = "0.3"
sha2 = "0.10"
hex = "0.4"

[features]
# C 阶段（DEV_09 §3.3）：WasmActor 接线——wasmtime 重编译成本高（R1），
# 默认关；开启后 executor_v2 支持 AdminArtifactRef::Wasm 部署。
default = []
wasm = ["dep:parrot-wasm", "parrot-wasm/runtime"]

[lib]
name = "parrot_node"
path = "src/lib.rs"

[[bin]]
name = "parrot-node"
path = "src/main.rs"

[[bin]]
name = "parrot-probe"
path = "src/bin/parrot-probe.rs"

[dev-dependencies]
hex = "0.4"
sha2 = "0.10"
bytes = "1"
