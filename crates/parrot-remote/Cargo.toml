[package]
name = "parrot-remote"
version = "0.1.0"
edition = "2021"
description = "Parrot remote layer: Wire 1.0 framing, transports, codec registry, remote refs (DEV_01)"
license = "MIT"

[dependencies]
parrot-config = { path = "../parrot-config" }
parrot-api = { path = "../parrot-api", features = ["remote-protobuf"] }
tokio = { version = "1", features = ["net", "time", "sync", "io-util", "rt-multi-thread", "macros", "test-util", "process", "signal", "parrot-deferred-mpsc"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
bytes = { version = "1", features = ["serde"] }
bincode = { workspace = true }
serde = { version = "1", features = ["derive"] }
inventory = "0.3"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
futures = "0.3"
serde_json = "1"
tempfile = "3"
uuid = { version = "1.0", features = ["v4"] }
sha2 = "0.10.9"
quinn = { version = "0.11.12", features = ["rustls", "runtime-tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1.15.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
x509-parser = { version = "0.18.1", default-features = false }
prost = { version = "0.14.4", features = ["derive"] }
rcgen = "0.14.10"
# E7 MQTT 桥（DECISIONS_DEPENDENCIES 2026-10-04 裁定：rumqttc 锁 minor）
rumqttc = { path = "../../vendor/rumqttc", default-features = false, features = ["use-rustls-no-provider"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["tcp"]
mem  = []   # MemoryTransport 测试载体（§10.2 回环集成；RC1-RC8 mem+tcp 双跑）
tcp  = []   # TcpTransport（P1 主载体）
# quic = [] # P2 增（DEV_02 K3）

[[bin]]
name = "dump-vectors"
path = "src/bin/dump_vectors.rs"

[[bin]]
name = "remote-bench"
path = "src/bin/remote_bench.rs"

[[bin]]
name = "interop-matrix"
path = "src/bin/interop_matrix.rs"

[[bin]]
name = "interop-ray"
path = "src/bin/interop_ray.rs"

[[bin]]
name = "interop-erl"
path = "src/bin/interop_erl.rs"

[dev-dependencies]
parrot-api-derive = { path = "../parrot-api-derive" }
prost-build = "0.14.4"
rcgen = "0.14.10"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
