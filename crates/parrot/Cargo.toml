[package]
name = "parrot"
version = "0.1.0"
edition = "2024"

[features]
# M5 工程审慎逃生阀：ask 路径回退历史双装箱（payload Box + envelope Box）。
# 首个稳定版移除（计划 M5 节"工程审慎"）。
parrot_envelope_legacy = []

[dependencies]
parrot-api = { path = "../parrot-api" }
parrot-api-derive = { path = "../parrot-api-derive" }
parrot-config = { path = "../parrot-config" }
actix = "0.13"
async-trait = "0.1"
thiserror = "2.0"
futures = "0.3"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }
anyhow = "1.0"
num_cpus = "1.0"
lazy_static = "1.5.0"
flume = "0.11.1"
ringbuf = { version = "0.4.8", features = ["alloc"] } 
crossbeam-queue = "0.3.10"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
atty = "0.2.14"
downcast-rs = "2.0.0"

[dev-dependencies]
tokio = { workspace = true }
parrot-remote = { path = "../parrot-remote" }
parrot-api = { path = "../parrot-api", features = ["remote"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumqttc = "0.24"
bincode = "2"


[[example]]
name = "simple"
path = "examples/actor/simple.rs" 

[[example]]
name = "ping_pong"
path = "examples/ping_pong.rs"

